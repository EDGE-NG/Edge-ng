# CodeQL: GitHub's security scan of our TypeScript (web/, api/, shared/).
# It looks for things like injection, open redirects and unsafe handling of
# user input. Findings show under Security → Code scanning, and on the pull
# request that introduces them. Free for public repositories.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1" # Mondays 04:30 UTC, to catch newly known issues

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL - security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules"
              - "**/*.test.ts"
              - "**/dist"
              - "**/.next"
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
